[package]
name = "niri-settings"
version = "0.1.0"
description = "Niri Settings UI"
authors = ["zak"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.0", features = ["devtools"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
kdl = { version = "6", features = ["v1-fallback"] }
uuid = { version = "1", features = ["v4"] }
dirs = "6"
thiserror = "2"
similar = "2"
